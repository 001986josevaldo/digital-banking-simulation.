<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Banco Python</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container" id="app">

        <!-- Tela de Cadastro -->
        <div class="card" id="register-section">
            <h2>Criar Nova Conta</h2>
            <div class="form-group">
                <label>Novo Usuário:</label>
                <input type="text" id="reg-username" placeholder="Escolha um nome de usuário">
            </div>
            <div class="form-group">
                <label>Nova Senha:</label>
                <input type="password" id="reg-password" placeholder="Crie uma senha forte">
            </div>
            <div style="display: flex; gap: 10px; flex-direction: column;">
                <button onclick="registrar()" style="background-color: var(--primary);">Criar Conta</button>
                <!-- Redireciona de volta para a página de login -->
                <button onclick="window.location.href='index.html'" style="background-color: transparent; color: #7f8c8d; border: 1px solid #7f8c8d;">Voltar para o Login</button>
            </div>
            <div id="reg-msg" class="alert"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
